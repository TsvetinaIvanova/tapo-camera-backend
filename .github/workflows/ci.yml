name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.12"
  TF_VERSION: "1.15.8"

jobs:

  # ── Python lint & test ──────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install flake8 boto3 pyyaml pytapo

      - name: Lint poller
        run: flake8 poller/ --max-line-length=140 --exclude=__pycache__

      - name: Lint lambdas
        run: flake8 terraform/lambda/ --max-line-length=140 --exclude=__pycache__

      - name: Lint scripts
        run: flake8 scripts/ --max-line-length=140 --exclude=__pycache__

      - name: Lint tests
        run: flake8 tests/ --max-line-length=140 --exclude=__pycache__

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # moto mocks AWS in-process; no credentials are needed or used.
      - name: Run tests
        run: python -m pytest -v

  # ── Processor image: build + smoke test ─────────────────
  processor-image:
    name: Processor image
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v6

      # ECR Public throttles anonymous pulls per source IP, and runners
      # share IPs, so the base image's manifest fetch got 429s for minutes
      # at a time. Log in as the image-pull role, which can only get an ECR
      # Public token. Dependabot PRs can't read the role ARN secret, so they
      # stay anonymous (same reason tf-plan skips them).
      - name: Configure AWS credentials (OIDC)
        if: github.actor != 'dependabot[bot]'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IMAGE_PULL_ROLE_ARN }}
          aws-region: eu-central-1
          mask-aws-account-id: true

      - name: Log in to ECR Public
        if: github.actor != 'dependabot[bot]'
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - uses: docker/setup-buildx-action@v4

      # GitHub Actions cache: the ffmpeg compile stage (~6 min) is reused
      # unless the Dockerfile's build stage changes.
      # No build record or job summary, matching deploy.yml (nothing
      # sensitive here, but the build is the same).
      # Retry once after a pause, mainly for Dependabot PRs' anonymous
      # pulls; a second failure fails the job.
      - name: Build image
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: terraform/lambda/processor
          tags: tapo-clip-processor:ci
          load: true
          cache-from: type=gha,scope=processor
          cache-to: type=gha,mode=max,scope=processor

      - name: Wait before retrying the build
        if: steps.build.outcome == 'failure'
        run: sleep 60

      - name: Build image (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: terraform/lambda/processor
          tags: tapo-clip-processor:ci
          load: true
          cache-from: type=gha,scope=processor
          cache-to: type=gha,mode=max,scope=processor

      - name: Smoke test
        run: terraform/lambda/processor/smoke-test.sh tapo-clip-processor:ci

  # ── Terraform validate & plan ───────────────────────────
  tf-plan:
    name: Terraform plan
    # Dependabot PRs can't read Actions secrets, so the OIDC login has no
    # role to assume. Its bumps (pip pins, image base digest) don't affect
    # the plan, so skip the job rather than give bot PRs AWS credentials.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC
      contents: read
      pull-requests: write  # to post plan as PR comment

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-central-1
          mask-aws-account-id: true

      # The plan prints the poller's access key ID (not secret, but no reason
      # to publish it). Masked in logs here; redacted in the PR comment below.
      - name: Mask access key IDs
        run: |
          for id in $(aws iam list-access-keys --user-name tapo-poller \
              --query 'AccessKeyMetadata[].AccessKeyId' --output text); do
            echo "::add-mask::$id"
          done

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        id: plan
        env:
          TF_VAR_alert_email: ${{ secrets.TF_ALERT_EMAIL }}
        run: |
          terraform plan -no-color -lock-timeout=5m -out=tfplan 2>&1 | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # Post plan as a comment on PRs so you can review before merging.
      # Log masking doesn't apply to comments (the plan is read from a file),
      # so the account ID, alert e-mail and access key IDs are redacted here.
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ALERT_EMAIL: ${{ secrets.TF_ALERT_EMAIL }}
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const accountId = execSync(
              'aws sts get-caller-identity --query Account --output text'
            ).toString().trim();
            let plan = fs.readFileSync('terraform/plan_output.txt', 'utf8');
            // Literal replacements; skip empty values (split('') would
            // split between every character).
            for (const [value, label] of [
              [accountId, '<account-id>'],
              [process.env.ALERT_EMAIL, '<alert-email>'],
            ]) {
              if (value) plan = plan.split(value).join(label);
            }
            plan = plan.replace(/\b(AKIA|ASIA)[0-9A-Z]{16}\b/g, '<access-key-id>');
            const truncated = plan.length > 60000
              ? plan.slice(0, 60000) + '\n\n... (truncated)'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`hcl\n${truncated}\n\`\`\``
            });