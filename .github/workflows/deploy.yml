name: Deploy

on:
  push:
    branches: ["main"]

# Never run two applies at once, and never cancel one mid-apply (a killed
# apply can leave a stale state lock and half-applied changes).
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.8"
  AWS_REGION: eu-central-1

jobs:

  # ── Terraform apply ─────────────────────────────────────
  terraform:
    name: Terraform apply
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    outputs:
      frontend_bucket: ${{ steps.tf-output.outputs.frontend_bucket }}
      api_endpoint: ${{ steps.tf-output.outputs.api_endpoint }}
      processor_repo_url: ${{ steps.tf-output.outputs.processor_repo_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false   # needed to capture outputs cleanly

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_alert_email: ${{ secrets.TF_ALERT_EMAIL }}
        run: terraform apply -auto-approve

      - name: Capture Terraform outputs
        id: tf-output
        working-directory: terraform
        run: |
          echo "frontend_bucket=$(terraform output -raw frontend_bucket)" >> $GITHUB_OUTPUT
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> $GITHUB_OUTPUT
          echo "processor_repo_url=$(terraform output -raw processor_image_repository_url)" >> $GITHUB_OUTPUT

  # ── Processor image: build, test, push, report scan ─────
  # Runs after apply so the ECR repository exists. Not yet used by the
  # function (it still runs from the zip + layer).
  processor-image:
    name: Processor image
    runs-on: ubuntu-latest
    needs: terraform
    permissions:
      id-token: write
      contents: read

    env:
      REPO_URL: ${{ needs.terraform.outputs.processor_repo_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          # Immutable tags must be unique, including for re-runs of the same commit
          TAG="${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker build -t "$REPO_URL:$TAG" terraform/lambda/processor

      - name: Smoke test
        run: terraform/lambda/processor/smoke-test.sh "$REPO_URL:$TAG"

      - name: Push image
        run: docker push "$REPO_URL:$TAG"

      # Report, don't gate: Debian always has some open low-severity CVEs.
      - name: Report scan findings
        run: |
          REPO="${REPO_URL#*/}"
          IMAGE_ID="imageTag=$TAG"
          # The scan record appears a few seconds after the push, and the
          # waiter fails (rather than waits) on ScanNotFoundException. Poll
          # until it exists; fail loudly if it never does (scan-on-push broken).
          for i in $(seq 1 30); do
            if aws ecr describe-image-scan-findings --repository-name "$REPO" --image-id "$IMAGE_ID" >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::No scan found for $TAG after 5 minutes; check the repository/registry scanning configuration"
              exit 1
            fi
            sleep 10
          done
          aws ecr wait image-scan-complete --repository-name "$REPO" --image-id "$IMAGE_ID"
          {
            echo "### Processor image \`$TAG\`"
            echo "ECR basic scan findings by severity:"
            echo '```json'
            aws ecr describe-image-scan-findings --repository-name "$REPO" --image-id "$IMAGE_ID" \
              --query 'imageScanFindings.findingSeverityCounts' --output json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Deploy frontend ─────────────────────────────────────
  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    needs: terraform
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy frontend to S3
        run: |
          API_ENDPOINT="${{ needs.terraform.outputs.api_endpoint }}"

          # Generate config.json
          echo "{\"apiBase\": \"${API_ENDPOINT}\"}" > /tmp/config.json

          # Upload both files
          aws s3 cp /tmp/config.json \
            s3://${{ needs.terraform.outputs.frontend_bucket }}/config.json \
            --content-type "application/json" \
            --cache-control "no-cache"

          aws s3 cp frontend/index.html \
            s3://${{ needs.terraform.outputs.frontend_bucket }}/index.html \
            --content-type "text/html" \
            --cache-control "no-cache"

          echo "✅ Frontend deployed"