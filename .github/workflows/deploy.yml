name: Deploy

on:
  push:
    branches: ["main"]

# Never run two applies at once, and never cancel one mid-apply (a killed
# apply can leave a stale state lock and half-applied changes).
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.8"
  AWS_REGION: eu-central-1

jobs:

  # ── Terraform apply ─────────────────────────────────────
  terraform:
    name: Terraform apply
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    outputs:
      frontend_bucket: ${{ steps.tf-output.outputs.frontend_bucket }}
      api_endpoint: ${{ steps.tf-output.outputs.api_endpoint }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false   # needed to capture outputs cleanly

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_alert_email: ${{ secrets.TF_ALERT_EMAIL }}
        run: terraform apply -auto-approve

      - name: Capture Terraform outputs
        id: tf-output
        working-directory: terraform
        run: |
          echo "frontend_bucket=$(terraform output -raw frontend_bucket)" >> $GITHUB_OUTPUT
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> $GITHUB_OUTPUT

  # ── Deploy frontend ─────────────────────────────────────
  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    needs: terraform
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy frontend to S3
        run: |
          API_ENDPOINT="${{ needs.terraform.outputs.api_endpoint }}"

          # Generate config.json
          echo "{\"apiBase\": \"${API_ENDPOINT}\"}" > /tmp/config.json

          # Upload both files
          aws s3 cp /tmp/config.json \
            s3://${{ needs.terraform.outputs.frontend_bucket }}/config.json \
            --content-type "application/json" \
            --cache-control "no-cache"

          aws s3 cp frontend/index.html \
            s3://${{ needs.terraform.outputs.frontend_bucket }}/index.html \
            --content-type "text/html" \
            --cache-control "no-cache"

          echo "✅ Frontend deployed"