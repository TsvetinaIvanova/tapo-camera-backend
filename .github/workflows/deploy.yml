name: Deploy

on:
  push:
    branches: ["main"]

# Never run two applies at once, and never cancel one mid-apply (a killed
# apply can leave a stale state lock and half-applied changes).
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.8"
  AWS_REGION: eu-central-1

jobs:

  # ── Processor image: build, smoke-test, push ────────────
  # Runs first: apply pins the function to the digest pushed here, so the
  # function always runs exactly the image that passed the smoke test.
  processor-image:
    name: Processor image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    outputs:
      tag: ${{ steps.repo.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The base image comes from ECR Public; logged-in pulls count against
      # this account's quota, not the runner IP's shared anonymous one.
      - name: Log in to ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Repository and tag
        id: repo
        run: |
          # Immutable tags must be unique, including for re-runs of the same commit
          TAG="${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REPO_URL="${{ steps.ecr.outputs.registry }}/tapo-clip-processor"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "REPO_URL=$REPO_URL" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # Loaded locally (not pushed) so the smoke test runs before the push.
      # No build record or job summary: the tag holds the ECR registry URL,
      # so they would publish the AWS account ID unmasked (masking only
      # applies to the log).
      # ECR Public rate-limits anonymous pulls per IP, and runners share IPs,
      # so the base image's manifest fetch sometimes gets a 429. Retry once
      # after a pause; a second failure fails the job.
      - name: Build image
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: terraform/lambda/processor
          tags: ${{ env.REPO_URL }}:${{ env.TAG }}
          load: true
          provenance: false # plain image manifest; Lambda and ECR basic scanning expect one
          cache-from: type=gha,scope=processor
          cache-to: type=gha,mode=max,scope=processor

      - name: Wait before retrying the build
        if: steps.build.outcome == 'failure'
        run: sleep 60

      - name: Build image (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: terraform/lambda/processor
          tags: ${{ env.REPO_URL }}:${{ env.TAG }}
          load: true
          provenance: false # plain image manifest; Lambda and ECR basic scanning expect one
          cache-from: type=gha,scope=processor
          cache-to: type=gha,mode=max,scope=processor

      - name: Smoke test
        run: terraform/lambda/processor/smoke-test.sh "$REPO_URL:$TAG"

      - name: Push image
        id: push
        run: |
          docker push "$REPO_URL:$TAG"
          DIGEST=$(aws ecr describe-images --repository-name tapo-clip-processor \
            --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text)
          echo "Pushed $REPO_URL:$TAG ($DIGEST)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  # ── Terraform apply ─────────────────────────────────────
  terraform:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: processor-image
    permissions:
      id-token: write
      contents: read

    outputs:
      frontend_bucket: ${{ steps.tf-output.outputs.frontend_bucket }}
      api_endpoint: ${{ steps.tf-output.outputs.api_endpoint }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false   # needed to capture outputs cleanly

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      # The apply prints the poller's access key ID (not secret, but no reason
      # to publish it).
      - name: Mask access key IDs
        run: |
          for id in $(aws iam list-access-keys --user-name tapo-poller \
              --query 'AccessKeyMetadata[].AccessKeyId' --output text); do
            echo "::add-mask::$id"
          done

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_alert_email: ${{ secrets.TF_ALERT_EMAIL }}
          TF_VAR_processor_image_digest: ${{ needs.processor-image.outputs.digest }}
        run: terraform apply -auto-approve

      - name: Capture Terraform outputs
        id: tf-output
        working-directory: terraform
        run: |
          echo "frontend_bucket=$(terraform output -raw frontend_bucket)" >> $GITHUB_OUTPUT
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> $GITHUB_OUTPUT

  # ── Processor image scan report ─────────────────────────
  # Separate job so waiting for the scan doesn't delay the apply.
  processor-image-scan:
    name: Processor image scan
    runs-on: ubuntu-latest
    needs: processor-image
    permissions:
      id-token: write
      contents: read

    env:
      TAG: ${{ needs.processor-image.outputs.tag }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      # Report, don't gate: Debian always has some open low-severity CVEs.
      - name: Report scan findings
        run: |
          REPO=tapo-clip-processor
          IMAGE_ID="imageTag=$TAG"
          # The scan record appears a few seconds after the push, and the
          # waiter fails (rather than waits) on ScanNotFoundException. Poll
          # until it exists; fail loudly if it never does (scan-on-push broken).
          for i in $(seq 1 30); do
            if aws ecr describe-image-scan-findings --repository-name "$REPO" --image-id "$IMAGE_ID" >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::No scan found for $TAG after 5 minutes; check the repository/registry scanning configuration"
              exit 1
            fi
            sleep 10
          done
          aws ecr wait image-scan-complete --repository-name "$REPO" --image-id "$IMAGE_ID"
          {
            echo "### Processor image \`$TAG\`"
            echo "ECR basic scan findings by severity:"
            echo '```json'
            aws ecr describe-image-scan-findings --repository-name "$REPO" --image-id "$IMAGE_ID" \
              --query 'imageScanFindings.findingSeverityCounts' --output json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Deploy frontend ─────────────────────────────────────
  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    needs: terraform
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Deploy frontend to S3
        run: |
          API_ENDPOINT="${{ needs.terraform.outputs.api_endpoint }}"

          # Generate config.json
          echo "{\"apiBase\": \"${API_ENDPOINT}\"}" > /tmp/config.json

          # Upload both files
          aws s3 cp /tmp/config.json \
            s3://${{ needs.terraform.outputs.frontend_bucket }}/config.json \
            --content-type "application/json" \
            --cache-control "no-cache"

          aws s3 cp frontend/index.html \
            s3://${{ needs.terraform.outputs.frontend_bucket }}/index.html \
            --content-type "text/html" \
            --cache-control "no-cache"

          echo "✅ Frontend deployed"